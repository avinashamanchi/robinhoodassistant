[project]
name = "trading-assistant"
version = "0.1.0"
description = "LLM-driven agentic trading assistant (Alpaca, MCP). Human-gated, risk-enforced."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "cryptography>=48.0.1,<49",
    "keyring>=25,<27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "tzdata>=2024.1",
]

[project.scripts]
trading-operator = "trading_assistant.ops.operator_terminal:main"

[project.optional-dependencies]
# Broker / server / app deps land in later phases; kept optional so Phase 1
# installs and tests with zero network-capable packages.
broker = ["alpaca-py>=0.21"]
mcp = ["mcp>=1.2"]
app = ["fastapi>=0.110", "uvicorn>=0.29", "anthropic>=0.39"]
notify = ["python-telegram-bot>=21"]
# Alternative LLM providers. Exactly one is selected at startup.
llm = ["google-genai>=1.0", "groq>=0.11"]
# External market data (equities historical via Alpaca; crypto via CoinGecko).
marketdata = ["httpx>=0.27"]
# Phase 7: signals + backtesting.
analysis = ["pandas>=2.1", "numpy>=1.26", "pyarrow>=15.0"]
[dependency-groups]
dev = [
    "httpx2>=2.0.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_assistant"]
