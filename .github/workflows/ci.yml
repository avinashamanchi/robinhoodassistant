name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history for the secret scan

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install supported dependencies
        run: uv sync --all-extras --dev

      - name: Full deterministic test suite
        run: uv run pytest

      - name: Combined safety branch coverage >= 90%
        run: |
          uv run pytest --cov=trading_assistant.risk \
            --cov=trading_assistant.orders \
            --cov=trading_assistant.rules \
            --cov=trading_assistant.app.auth \
            --cov-branch --cov-fail-under=90

      - name: Static release-safety checks
        run: uv run python scripts/check_release_safety.py

      - name: Migration and offline safety drill
        shell: bash
        run: |
          ci_safety_stage="$(mktemp -d)"
          ci_safety_dir="$(cd "$ci_safety_stage" && pwd -P)"
          trap 'rm -rf "$ci_safety_dir"' EXIT
          export DATABASE_URL="sqlite:///$ci_safety_dir/source.sqlite3"
          export APP_API_TOKEN="ci-safety-only-not-a-production-secret"
          uv run python -m trading_assistant.db.migrate upgrade
          # The online-WAL path is covered with a held-open writer in pytest.
          # This closed CI fixture uses DELETE so a read-only open need not
          # create WAL/SHM sidecars beside the source.
          export CI_SAFETY_DB="$ci_safety_dir/source.sqlite3"
          uv run python - <<'PY'
          import os
          import sqlite3

          with sqlite3.connect(os.environ["CI_SAFETY_DB"]) as connection:
              connection.execute("PRAGMA wal_checkpoint(TRUNCATE)")
              assert connection.execute(
                  "PRAGMA journal_mode=DELETE"
              ).fetchone() == ("delete",)
          PY
          uv run python -m trading_assistant.ops.safety_drill \
            --database-copy "$ci_safety_dir/drill.sqlite3" --mock

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
