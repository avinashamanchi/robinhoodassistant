name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the complete candidate history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"

      - name: Set up Python 3.11
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: uv python install --no-config 3.11.15

      - name: Install locked test dependencies without project code
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: |
          uv lock --check --no-build --no-config
          uv sync --frozen --all-extras --dev \
            --no-install-project --no-build --no-config \
            --managed-python --python 3.11.15

      - name: Run the deterministic release verifier
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: |
          uv_source="$(command -v uv)"
          node_source="$(command -v node)"
          verifier_python="$(uv python find --managed-python \
            --no-project --no-config --resolve-links 3.11.15)"
          sudo install -o root -g root -m 0555 \
            "$uv_source" /usr/local/bin/uv
          sudo install -o root -g root -m 0555 \
            "$node_source" /usr/local/bin/node
          export PATH="/usr/local/bin:/usr/bin:/bin"
          "$verifier_python" -I -S scripts/verify_loopback_release.py

      - name: Verify and install the full locked dependency graph
        run: |
          uv sync --all-extras --dev
          uv pip check

      - name: Audit installed dependencies
        run: uv run --with pip-audit==2.10.1 pip-audit

      - name: Prepare isolated development-only migration secrets
        shell: bash
        run: |
          uv run python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          import secrets

          stage = Path(os.environ["RUNNER_TEMP"]) / "trading-assistant-release"
          stage.mkdir(mode=0o700, parents=False, exist_ok=False)
          values = {
              "DATABASE_URL": f"sqlite:///{stage / 'source.sqlite3'}",
              "CANDIDATE_SIGNING_KEY": base64.b64encode(
                  secrets.token_bytes(32)
              ).decode("ascii"),
              "BACKUP_ENCRYPTION_KEY": base64.b64encode(
                  secrets.token_bytes(32)
              ).decode("ascii"),
              "FIELD_ENCRYPTION_KEYS_JSON": json.dumps(
                  {
                      "local-primary-2026-07": base64.b64encode(
                          secrets.token_bytes(32)
                      ).decode("ascii")
                  },
                  separators=(",", ":"),
              ),
              "CI_RELEASE_STAGE": str(stage),
          }
          for value in values.values():
              print(f"::add-mask::{value}")
          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8",
          ) as environment:
              for name, value in values.items():
                  environment.write(f"{name}={value}\n")
          PY

      - name: Apply and verify migrations on an isolated database
        run: |
          uv run python -m trading_assistant.db.migrate --development-environment-secrets upgrade
          uv run python -m trading_assistant.db.migrate --development-environment-secrets status

      - name: Run the isolated mock safety drill
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path
          import sqlite3

          stage = Path(os.environ["CI_RELEASE_STAGE"]).resolve(strict=True)
          source = (stage / "source.sqlite3").resolve(strict=True)
          if source.parent != stage or not source.is_file():
              raise RuntimeError("isolated source database is unavailable")
          with sqlite3.connect(
              f"file:{source}?mode=rw",
              uri=True,
          ) as connection:
              connection.execute("PRAGMA wal_checkpoint(TRUNCATE)")
              mode = connection.execute(
                  "PRAGMA journal_mode=DELETE"
              ).fetchone()
              if mode != ("delete",):
                  raise RuntimeError("isolated database journal is not closed")
          PY
          uv run python -m trading_assistant.ops.safety_drill \
            --development-environment-secrets \
            --database-copy "$CI_RELEASE_STAGE/drill.sqlite3" \
            --mock

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the complete candidate history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the complete Git history
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
