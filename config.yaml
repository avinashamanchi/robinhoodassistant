# Trading Assistant configuration (committed, non-secret).
# The risk section is the law: it is enforced on EVERY order, server-side,
# regardless of what the LLM requested. Unknown keys here FAIL to load (A8).

server:
  bind_host: 127.0.0.1
  port: 8020
  origin: https://localhost:8020
  allowed_hosts: [localhost, 127.0.0.1, "::1"]
  tls_ca_path: .local/tls/rootCA.pem
  tls_cert_path: .local/tls/localhost.pem
  tls_key_path: .local/tls/localhost-key.pem
  secure_cookies: true

provider_origins:
  alpaca_trading: https://paper-api.alpaca.markets
  alpaca_data: https://data.alpaca.markets
  alpaca_stream: wss://stream.data.alpaca.markets
  anthropic: https://api.anthropic.com
  gemini: https://generativelanguage.googleapis.com
  groq: https://api.groq.com
  telegram: https://api.telegram.org
  coingecko: https://api.coingecko.com

encryption:
  required: true
  schema_version: 1
  active_key_id: local-primary-2026-07
  retained_key_ids: []
  backup_key_id: local-backup-2026-07
  backup_directory: .local/encrypted-backups

integrations:
  webhooks_enabled: false
  composio_enabled: false

trading:
  mode: paper              # legacy live parses for diagnostics but is rejected
  broker: alpaca           # mock | alpaca  — routes orders to Alpaca PAPER
  request_timeout_seconds: 10
  reconciliation_max_age_seconds: 300

risk:
  ticker_allowlist: [AAPL, MSFT, GOOGL, GOOG, AMZN, NVDA, META, TSLA]
  max_notional_per_order: 2000       # USD per single order
  max_position_per_ticker: 5000      # USD notional held in one name
  max_portfolio_exposure: 10000      # USD total across positions
  daily_realized_loss_limit: 500     # USD; breach trips the kill switch
  price_sanity_pct: 5.0              # reject limit orders >5% from last trade
  reject_when_market_closed: true    # fail closed; no global after-hours queueing
  proposal_ttl_minutes: 15           # proposals older than this EXPIRE (A6)
  warn_on_cross_broker_concentration: true  # non-blocking WARNING only
  per_trade_risk_pct: 0.5             # % of equity risked per trade (sizing)
  max_quote_age_seconds: 60
  max_spread_pct: 1.0
  max_daily_total_loss: 500
  max_account_drawdown_pct: 10.0
  require_broker_reconciled: true

# Crypto risk limits — independent allowlist + kill switch (Phase 7).
# 24/7 market: never rejected for "closed"; daily P&L boundary is UTC midnight.
crypto_risk:
  ticker_allowlist: ["BTC/USD", "ETH/USD"]
  max_notional_per_order: 500
  max_position_per_ticker: 2000
  max_portfolio_exposure: 10000
  daily_realized_loss_limit: 500
  price_sanity_pct: 8.0                 # crypto is more volatile than equities
  reject_when_market_closed: false      # crypto trades 24/7
  proposal_ttl_minutes: 15
  max_quote_age_seconds: 60
  max_spread_pct: 1.0
  max_daily_total_loss: 500
  max_account_drawdown_pct: 10.0
  require_broker_reconciled: true

# Backtest cost model (Phase 7). Fees and slippage are separate.
backtest:
  fills:
    market: next_bar_open
    limit: bar_range_cross
    max_participation_pct: 10
  slippage_bps:
    equity: 5
    crypto: 20
  fees_bps:
    equity: 0                           # Alpaca equities commission-free
    crypto: 25                          # Alpaca crypto worst taker tier
  holdout_months: 12

features:
  auto_execute_preapproved_rules: false   # keep OFF until paper evidence and safety review pass
  telegram_notifications: false           # (Phase 4)
  shadow_mode: true                       # screen+analyze+grade live, zero orders (D1)

# Opt-in autonomous paper-trading loop (trading_assistant.autopilot).
# PAPER-ONLY: the autopilot refuses to run unless trading.mode=paper, and every
# order it places still passes through the deterministic risk engine below, which
# stays the final authority. Nothing trades until you run:
#   uv run python -m trading_assistant.autopilot        (loop)
#   uv run python -m trading_assistant.autopilot --once (single cycle)
autopilot:
  enabled: true
  strategy: sma_crossover
  universe: []                            # empty -> risk.ticker_allowlist
  notional_per_trade: 1000                # USD per entry (<= risk.max_notional_per_order)
  max_orders_per_day: 8
  poll_interval_seconds: 300

execution:
  prefer_bracket_orders: false            # OFF until extended paper concurrency drills pass

security:
  session_hours: 8
  reauthentication_minutes: 5
  rate_limits:
    login:
      requests: 5
      global_requests: 20
      window_seconds: 900
      concurrency: 2
      daily_requests: null
      global_daily_requests: null
    session_read:
      requests: 120
      global_requests: 240
      window_seconds: 60
      concurrency: 16
      daily_requests: null
      global_daily_requests: null
    broker_read:
      requests: 30
      global_requests: 60
      window_seconds: 60
      concurrency: 4
      daily_requests: null
      global_daily_requests: null
    mutation:
      requests: 20
      global_requests: 40
      window_seconds: 60
      concurrency: 4
      daily_requests: null
      global_daily_requests: null
    approval:
      requests: 10
      global_requests: 20
      window_seconds: 300
      concurrency: 1
      daily_requests: null
      global_daily_requests: null
    privileged:
      requests: 5
      global_requests: 10
      window_seconds: 300
      concurrency: 1
      daily_requests: null
      global_daily_requests: null
    chat:
      requests: 10
      global_requests: 20
      window_seconds: 600
      concurrency: 1
      daily_requests: null
      global_daily_requests: null
    analysis:
      requests: 5
      global_requests: 10
      window_seconds: 600
      concurrency: 1
      daily_requests: null
      global_daily_requests: null
    backtest:
      requests: 2
      global_requests: 6
      window_seconds: 3600
      concurrency: 1
      daily_requests: 6
      global_daily_requests: 6
    provider_read:
      requests: 180
      global_requests: 240
      window_seconds: 60
      concurrency: 8
      daily_requests: null
      global_daily_requests: null
    panic:
      requests: 60
      global_requests: 120
      window_seconds: 60
      concurrency: 1
      daily_requests: null
      global_daily_requests: null
  provider_budget:
    daily_calls: 100
    daily_input_tokens: 1000000
    daily_output_tokens: 200000
    reservation_ttl_seconds: 300
    max_chat_tool_turns: 8
    max_structured_attempts: 2
    backtest_llm_enabled: false
    prices:
      "gemini:gemini-3.6-flash":
        model: gemini-3.6-flash
        effective_date: 2026-07-09
        input_usd_per_million: 1.50
        output_usd_per_million: 7.50
        source_url: https://ai.google.dev/gemini-api/docs/latest-model
  backtest_limits:
    runtime_seconds: 1200
    max_symbols: 20
    max_calendar_days: 3000
  request_bounds:
    default_body_bytes: 16384
    chat_body_bytes: 32768
    max_header_count: 64
    max_header_bytes: 16384

llm:
  provider: gemini            # anthropic | gemini | groq
  fallback_provider: null     # cross-provider runtime fallback is prohibited
  model: claude-sonnet-4-6    # used only when provider=anthropic
  gemini_model: gemini-3.6-flash
  groq_model: llama-3.3-70b-versatile
  max_tokens: 4096
  request_timeout_seconds: 45

daemon:
  poll_interval_seconds: 15
  use_websocket: false               # current daemon uses bounded snapshot polling
  max_quote_age_seconds: 60
  cycle_timeout_seconds: 90
  daily_task_timeout_seconds: 120
  heartbeat_stale_seconds: 180
