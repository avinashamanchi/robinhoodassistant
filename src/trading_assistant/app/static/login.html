<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Trading Assistant Login</title>
  <script src="/static/login.js" defer></script>
</head>
<body>
  <main>
    <h1>Operator login required</h1>
    <form id="login-form">
      <label for="secret">Operator secret</label>
      <input id="secret" name="secret" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
    <p id="status" role="status"></p>
  </main>
</body>
</html>
